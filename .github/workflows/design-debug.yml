# VORÜBERGEHEND: Diagnose des Designvergleichs in CI (wird wieder entfernt).
# Gibt Chromium-Version und die Bilder einiger Fehlschläge als Base64 im Log aus,
# weil der Artefakt-Host aus der Entwicklungsumgebung nicht erreichbar ist.
name: Design debug

on:
  push:
    branches: ["claude/browser-suite-gruen"]

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: ls "$HOME/.cache/ms-playwright"; fc-match system-ui; fc-match sans-serif; fc-list : family | sort -u | head -40
      - run: npm run build
      - run: npx playwright test --config playwright.design.config.ts --reporter=line
        continue-on-error: true
      - name: Bilder ausgeben
        run: |
          for id in 3c 5c-settings 9d-check; do
            dir=$(ls -d test-results/design-fidelity-Design-"$id" 2>/dev/null || true)
            [ -z "$dir" ] && continue
            for kind in actual diff; do
              echo "IMG-BEGIN $id-$kind"
              base64 -w0 "$dir/$id-$kind.png"
              echo
              echo "IMG-END $id-$kind"
            done
          done
