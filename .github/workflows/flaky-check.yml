# Vorübergehend (WebKit-Stabilisierung): nicht mergen, vor "Ready for review" löschen.
name: Flaky check

on:
  push:
    branches: [claude/webkit-flaky]

permissions:
  contents: read

jobs:
  repeat:
    name: repeat (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-webkit, mobile-safari, tablet-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: Browser-Tests (4 Tests, je 10 Wiederholungen, ohne Retries)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e.json
        run: >
          npx playwright test --project=${{ matrix.project }}
          --repeat-each=30 --retries=0 --reporter=list,json
          e2e/cloud-sync.spec.ts e2e/teacher-content.spec.ts e2e/platform-quality.spec.ts
          -g "zwei Geräte gleichen Material|Text anlegen, speichern|personal learning room keeps today|local teacher workspace manages classes"
      - name: Live-Test (10 Wiederholungen, ohne Retries)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/live.json
        run: >
          npx playwright test --config playwright.live.config.ts
          --project=${{ matrix.project }} --repeat-each=5 --retries=0
          --reporter=list,json
      - name: Zusammenfassung
        if: always()
        run: |
          { node .github/flaky/summary.mjs "$RUNNER_TEMP/e2e.json"
            node .github/flaky/summary.mjs "$RUNNER_TEMP/live.json"; } | tee -a "$GITHUB_STEP_SUMMARY"
