# Vorübergehend (WebKit-Stabilisierung): nicht mergen, vor "Ready for review" löschen.
name: Flaky check

on:
  push:
    branches: [claude/webkit-flaky]

permissions:
  contents: read

jobs:
  cloud-sync:
    name: cloud-sync 150x (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-webkit, mobile-safari, tablet-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: Wiederholungen (150, ohne Retries)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/diag.json
        run: >
          npx playwright test --project=${{ matrix.project }}
          --repeat-each=150 --retries=0 --reporter=list,json
          e2e/cloud-sync.spec.ts -g "zwei Geräte gleichen Material"
      - name: Zusammenfassung
        if: always()
        run: node .github/flaky/summary.mjs "$RUNNER_TEMP/diag.json" | tee -a "$GITHUB_STEP_SUMMARY"
