# Vorübergehend (WebKit-Stabilisierung): nicht mergen, vor "Ready for review" löschen.
name: Flaky check

on:
  push:
    branches: [claude/webkit-flaky]

permissions:
  contents: read

jobs:
  repeat:
    name: repeat (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-webkit, mobile-safari, tablet-safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: Navigation (goto) - teacher-content und Lernraum, je 30 Wiederholungen
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/nav.json
        run: >
          npx playwright test --project=${{ matrix.project }}
          --repeat-each=30 --retries=0 --reporter=list,json
          e2e/teacher-content.spec.ts e2e/platform-quality.spec.ts
          -g "Text anlegen, speichern|personal learning room keeps today"
      - name: Fehlerkontext Navigation
        if: always()
        run: for f in test-results/*/error-context.md; do [ -f "$f" ] && { echo "=== CONTEXT $f"; head -70 "$f"; }; done; true
      - name: QR und Cloud-Abgleich (Diagnose, 40 Wiederholungen)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/diag.json
        run: >
          npx playwright test --project=${{ matrix.project }}
          --repeat-each=40 --retries=0 --reporter=list,json
          e2e/cloud-sync.spec.ts e2e/platform-quality.spec.ts
          -g "zwei Geräte gleichen Material|local teacher workspace manages classes"
      - name: Fehlerkontext QR und Cloud
        if: always()
        run: for f in test-results/*/error-context.md; do [ -f "$f" ] && { echo "=== CONTEXT $f"; head -70 "$f"; }; done; true
      - name: Live-Test (Wortschatz-Transfer, 20 Wiederholungen)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/live.json
        run: >
          npx playwright test --config playwright.live.config.ts
          --project=${{ matrix.project }} --repeat-each=20 --retries=0
          --reporter=list,json e2e/live/vocabulary-transfer.spec.ts
      - name: Zusammenfassung
        if: always()
        run: |
          { node .github/flaky/summary.mjs "$RUNNER_TEMP/nav.json"
            node .github/flaky/summary.mjs "$RUNNER_TEMP/diag.json"
            node .github/flaky/summary.mjs "$RUNNER_TEMP/live.json"; } | tee -a "$GITHUB_STEP_SUMMARY"
