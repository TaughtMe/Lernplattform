# Vorübergehend (WebKit-Stabilisierung): nicht mergen, vor "Ready for review" löschen.
name: Flaky check

on:
  push:
    branches: [claude/webkit-flaky]

permissions:
  contents: read

jobs:
  repeat:
    name: ${{ matrix.name }} (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cloud-sync, project: mobile-safari, file: e2e/cloud-sync.spec.ts, grep: "zwei Geräte gleichen Material" }
          - { name: cloud-sync, project: tablet-safari, file: e2e/cloud-sync.spec.ts, grep: "zwei Geräte gleichen Material" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: Wiederholungen (100, ohne Retries)
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/diag.json
        run: >
          npx playwright test --project=${{ matrix.project }}
          --repeat-each=150 --retries=0 --reporter=list,json
          ${{ matrix.file }} -g "${{ matrix.grep }}"
      - name: Zusammenfassung
        if: always()
        run: node .github/flaky/summary.mjs "$RUNNER_TEMP/diag.json" | tee -a "$GITHUB_STEP_SUMMARY"
