name: Design-Referenzen erneuern

# Manuell (workflow_dispatch) oder per Label „design-referenzen-erneuern“ auf
# einem Pull Request. Erneuert die Referenzbilder in docs/design/referenz im selben
# Playwright-Container wie der Job design-quality und committet geänderte PNGs auf
# den angegebenen Branch. Referenzbild einer umgesetzten Ansicht = abgenommener
# App-Stand: Die Bilder im Pull Request vor dem Merge ansehen (siehe
# docs/design/README.md).

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, auf den die geänderten Bilder committet werden
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Pro Branch nur ein Lauf gleichzeitig: Zwei Läufe (z. B. Label zweimal gesetzt)
# würden sonst beide auf denselben Branch pushen.
concurrency:
  group: design-references-${{ inputs.branch || github.head_ref }}
  cancel-in-progress: false

jobs:
  update:
    # Label nur für Branches dieses Repositorys: Pull Requests aus Forks haben
    # keinen Schreibzugriff und sollen keine Commits auslösen.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'design-referenzen-erneuern' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      BRANCH: ${{ inputs.branch || github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.head_ref }}
          # Mit dem Geheimnis DESIGN_REFERENCES_TOKEN (Token mit Schreibrecht auf
          # Inhalte) startet der Bild-Commit die Quality-Läufe auf dem neuen Stand.
          # Ohne das Geheimnis gilt das GITHUB_TOKEN: Pushes damit lösen keine
          # Workflows aus (siehe docs/design/README.md).
          token: ${{ secrets.DESIGN_REFERENCES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:design -- --update-snapshots=changed
      - name: Geänderte Bilder committen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add docs/design/referenz
          if git diff --cached --quiet; then
            echo "Keine Bildänderungen."
            exit 0
          fi
          views=$(git diff --cached --name-only -- docs/design/referenz \
            | sed -E 's#.*/([^/]+)\.png$#\1#' | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Design-Referenzen erneuert: $views" \
            -m "Erzeugt mit npm run test:design -- --update-snapshots=changed im Playwright-Container (Workflow Design-Referenzen erneuern)."
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Geändert: $views" >> "$GITHUB_STEP_SUMMARY"

  # Label sofort entfernen (nicht erst nach dem Lauf), damit es jederzeit neu gesetzt
  # werden kann, auch wenn der Lauf noch läuft oder fehlschlägt. Eigener Job auf
  # dem Runner (im Playwright-Image gibt es kein gh).
  label-entfernen:
    if: github.event_name == 'pull_request' && github.event.label.name == 'design-referenzen-erneuern'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label design-referenzen-erneuern
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
