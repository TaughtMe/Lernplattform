version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Gruppen (siehe docs/umsetzungsplan-abhaengigkeiten.md, Abschnitt 4):
    # Die erste passende Gruppe gewinnt. Hauptversionen stehen in keiner Gruppe
    # und kommen als einzelne Pull Requests, außer den ESLint-Paketen. Sicherheits-Updates erstellt
    # GitHub unabhängig von diesem Zeitplan, sobald Dependabot security updates
    # im Repository eingeschaltet sind.
    # ESLint 10 ist gesperrt, bis eslint-plugin-react und eslint-plugin-jsx-a11y
    # es unterstützen (Stand 21.10.2026: beide nur bis ESLint 9). Einzelne PRs für
    # `eslint` oder `@eslint/js` scheitern sonst schon bei `npm ci`. Danach diesen
    # Eintrag entfernen; die Gruppe „eslint-major“ bündelt dann alles in einem PR.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      eslint-major:
        patterns:
          - eslint
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-plugin-*"
          - "@next/eslint-plugin-next"
          - typescript-eslint
          - globals
        update-types: [major]
      build-chain:
        patterns:
          - vinext
          - vite
          - "@vitejs/*"
          - "@cloudflare/*"
          - wrangler
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
